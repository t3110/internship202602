<!doctype html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>申込完了画面</title>
    <link rel="stylesheet" href="/css/bankLoanCommon.css"/>
    <link rel="stylesheet" href="/css/bankLoanCompletion.css"/>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-logo">
            <div class="header-logo-icon">
                <img src="/images/bank_logo.png" alt="かわらそば銀行ロゴ" />
            </div>
            <div class="header-logo-text">かわらそば銀行</div>
        </div>
        <div class="header-icon">🎉</div>
        <h1>申込が完了しました</h1>
        <p>ご利用いただきありがとうございました</p>
        <div class="progress-container">
            <div class="progress-bar-line">
                <div class="progress-bar-fill"></div>
            </div>
            <div class="progress-steps">
                <div class="progress-step completed">
                    <div class="progress-step-circle">✓</div>
                    <div class="progress-step-label">入力</div>
                </div>
                <div class="progress-step completed">
                    <div class="progress-step-circle">✓</div>
                    <div class="progress-step-label">確認</div>
                </div>
                <div class="progress-step completed">
                    <div class="progress-step-circle">✓</div>
                    <div class="progress-step-label">完了</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="success-badge">✓ 完了</div>

        <div class="info-box">
            <h3>📋 次のステップ</h3>
            <p>
                ご申込いただきありがとうございます。<br>
                当行で審査を進めさせていただきます。
            </p>
            <p>
                <strong>3営業日以内</strong>にメールにて<br>
                審査結果をお知らせいたします。
            </p>
        </div>

        <div class="info-box">
            <h3>ℹ️ ご確認ください</h3>
            <p>
                • 登録いただいたメールアドレスを<br>
                &nbsp;&nbsp;ご確認ください
            </p>
            <p>
                • ご不明な点はお気軽に<br>
                &nbsp;&nbsp;カスタマーサポートまでお問い合わせください
            </p>
        </div>

        <div class="button-group">
            <button onclick="window.location='/bankLoan';" class="btn btn-primary">新規申込</button>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 かわらそば銀行 - ローン申込サービス</p>
    </div>
</div>
</body>

</html>
